# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: build
    strategy:
      matrix:
        include:
          - os: Windows
            type: dev
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyinstaller
        if (-not (Test-Path -LiteralPath requirements.txt -PathType Leaf)) {
          throw "Missing dependency file: build/requirements.txt"
        }
        python -m pip install -r requirements.txt
    - name: Bundle an installer
      run: |
        pyinstaller -F -w --onedir `
        --add-data "engine/*.py;engine" `
        --add-data "content/presets/*.json;content/presets"  `
        --add-data "export/*.json;export" `
        main.py `
        --name "Laharoi Block Story Editor Dev Build" `
        --icon "icons.ico"
    - name: Upload artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: installer-${{ matrix.os }}-${{ matrix.type }}.zip
        path: build/dist/
        if-no-files-found: error
