name: 提交想法
description: 字面意思，万一被采纳了呢？
title: "[新想法] "
labels: []
assignees:
  - SungHerobrine97
type: new_feature
body: 
  - type: markdown
    attributes:
      value: |
        在提交之前你应该明白，这个项目属于同人项目，与原版Tetris无任何关联。
  - type: input
    id: contact
    attributes:
      label: 电子邮件
      description: 如果你不想接收来自Github Issue的通知，请在这里输入电子邮件。
      placeholder: ex. you@example.com
    validations:
      required: false
  - type: textarea
    id: feedback
    attributes:
      label: 内容
      description: 把想法写下来，如果你只是草草写了几句（或者导致无法理解）可能会导致issue被无理由关闭。
      value: "说几句……"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 想法来源
      description:
      placeholder: https://youtube.com/XXXXXXXXX
      value: ""
    validations:
      required: false
